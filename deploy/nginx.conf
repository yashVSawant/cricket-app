# Nginx Sample Configuration with SSL & WebSocket support for Cricket Tournament Platform

upstream backend_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.crickethub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.crickethub.example.com;

    ssl_certificate /etc/letsencrypt/live/api.crickethub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.crickethub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to NestJS API
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
